<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" fill="none">
  <defs>
    <linearGradient id="starGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@900&amp;display=swap');
    .wm-s {
      font-family: 'Syne', 'Outfit', -apple-system, sans-serif;
      font-weight: 900;
      fill: #ffffff;
      font-size: 92px;
    }
  </style>

  <!-- Monogram S with drop shadow for contrast on any video frame -->
  <text x="64" y="108" text-anchor="middle" class="wm-s" filter="url(#shadowGlow)">S</text>

  <!-- 4-Point Star -->
  <g transform="translate(108, 42)" filter="url(#shadowGlow)">
    <path d="M 0 -18 L 4 -4 L 18 0 L 4 4 L 0 18 L -4 4 L -18 0 L -4 -4 Z" fill="url(#starGlow)"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
</svg>
