<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" fill="none">
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1584" y2="396">
      <stop offset="0%" stop-color="#030508"/>
      <stop offset="50%" stop-color="#080c18"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>
    <radialGradient id="bannerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#1d4ed8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="starGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@900&amp;display=swap');
    .banner-title {
      font-family: 'Syne', 'Outfit', -apple-system, sans-serif;
      font-weight: 900;
      fill: #ffffff;
      font-size: 110px;
      letter-spacing: 0.18em;
    }
    .banner-sub {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      fill: #64748b;
      font-size: 14px;
      letter-spacing: 0.45em;
    }
  </style>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bannerBg)"/>
  <ellipse cx="792" cy="198" rx="600" ry="180" fill="url(#bannerAura)"/>

  <!-- Subtle Constellation lines in background -->
  <line x1="200" y1="120" x2="350" y2="220" stroke="rgba(56,189,248,0.15)" stroke-width="1"/>
  <line x1="350" y1="220" x2="500" y2="150" stroke="rgba(56,189,248,0.15)" stroke-width="1"/>
  <line x1="1080" y1="180" x2="1250" y2="110" stroke="rgba(56,189,248,0.15)" stroke-width="1"/>
  <line x1="1250" y1="110" x2="1400" y2="240" stroke="rgba(56,189,248,0.15)" stroke-width="1"/>

  <circle cx="200" cy="120" r="2" fill="#38bdf8"/>
  <circle cx="350" cy="220" r="2.5" fill="#ffffff"/>
  <circle cx="500" cy="150" r="2" fill="#38bdf8"/>
  <circle cx="1080" cy="180" r="2" fill="#38bdf8"/>
  <circle cx="1250" cy="110" r="2.5" fill="#ffffff"/>
  <circle cx="1400" cy="240" r="2" fill="#38bdf8"/>

  <!-- SMANIT Logo Text -->
  <text x="792" y="215" text-anchor="middle" class="banner-title">SMANIT</text>

  <!-- Star atop 'I' -->
  <g transform="translate(938, 125)" filter="url(#neonBlur)">
    <path d="M 0 -18 L 4 -4 L 18 0 L 4 4 L 0 18 L -4 4 L -18 0 L -4 -4 Z" fill="url(#starGlow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Subtitle -->
  <text x="792" y="270" text-anchor="middle" class="banner-sub">SMANIT.COM</text>
</svg>
