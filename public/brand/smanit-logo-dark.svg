<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" fill="none">
  <defs>
    <linearGradient id="starGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@800;900&amp;display=swap');
    .logo-text {
      font-family: 'Syne', 'Outfit', -apple-system, sans-serif;
      font-weight: 900;
      fill: #ffffff;
      font-size: 150px;
      letter-spacing: 0.16em;
    }
    .sub-text {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      fill: #94a3b8;
      font-size: 18px;
      letter-spacing: 0.45em;
    }
  </style>

  <!-- SMANIT Wordmark Text -->
  <text x="600" y="210" text-anchor="middle" class="logo-text">SMANIT</text>

  <!-- 4-Point Celestial Star positioned over the 'I' -->
  <!-- Center of 'I' is roughly at x=780 in 1200w viewBox with 0.16em spacing -->
  <g transform="translate(784, 88)" filter="url(#neonBlur)">
    <path d="M 0 -22 L 4.8 -4.8 L 22 0 L 4.8 4.8 L 0 22 L -4.8 4.8 L -22 0 L -4.8 -4.8 Z" fill="url(#starGlow)"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>

  <!-- Sub-label smanit.com -->
  <text x="600" y="275" text-anchor="middle" class="sub-text">SMANIT.COM</text>
</svg>
