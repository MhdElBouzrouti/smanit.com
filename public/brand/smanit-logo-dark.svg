<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@800;900&amp;display=swap');
    .logo-text {
      font-family: 'Syne', 'Outfit', -apple-system, sans-serif;
      font-weight: 900;
      fill: #ffffff;
      font-size: 150px;
      letter-spacing: 0.16em;
    }
    .logo-n {
      font-family: 'Syne', 'Outfit', -apple-system, sans-serif;
      font-weight: 900;
      fill: #f59e0b;
      font-size: 150px;
    }
    .sub-text {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      fill: #94a3b8;
      font-size: 17px;
      letter-spacing: 0.45em;
    }
  </style>

  <!-- Wordmark SMANIT -->
  <text x="600" y="210" text-anchor="middle">
    <tspan class="logo-text">SMA</tspan>
    <tspan class="logo-n">N</tspan>
    <tspan class="logo-text">IT</tspan>
  </text>

  <!-- Underline under N -->
  <rect x="566" y="230" width="68" height="4" rx="2" fill="#f59e0b"/>

  <!-- Sub-label smanit.com -->
  <text x="600" y="280" text-anchor="middle" class="sub-text">SMANIT.COM</text>
</svg>
