<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" fill="none">
  <defs>
    <linearGradient id="starGlowLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@800;900&amp;display=swap');
    .logo-text-light {
      font-family: 'Syne', 'Outfit', -apple-system, sans-serif;
      font-weight: 900;
      fill: #090a12;
      font-size: 150px;
      letter-spacing: 0.16em;
    }
    .sub-text-light {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      fill: #64748b;
      font-size: 18px;
      letter-spacing: 0.45em;
    }
  </style>

  <!-- SMANIT Wordmark Text -->
  <text x="600" y="210" text-anchor="middle" class="logo-text-light">SMANIT</text>

  <!-- 4-Point Celestial Star positioned over the 'I' -->
  <g transform="translate(784, 88)">
    <path d="M 0 -22 L 4.8 -4.8 L 22 0 L 4.8 4.8 L 0 22 L -4.8 4.8 L -22 0 L -4.8 -4.8 Z" fill="url(#starGlowLight)"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>

  <!-- Sub-label smanit.com -->
  <text x="600" y="275" text-anchor="middle" class="sub-text-light">SMANIT.COM</text>
</svg>
