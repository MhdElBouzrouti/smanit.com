<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@800;900&amp;display=swap');
    .logo-text-light {
      font-family: 'Syne', 'Outfit', -apple-system, sans-serif;
      font-weight: 900;
      fill: #090a12;
      font-size: 150px;
      letter-spacing: 0.16em;
    }
    .logo-n-light {
      font-family: 'Syne', 'Outfit', -apple-system, sans-serif;
      font-weight: 900;
      fill: #d97706;
      font-size: 150px;
    }
    .sub-text-light {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      fill: #64748b;
      font-size: 17px;
      letter-spacing: 0.45em;
    }
  </style>

  <!-- Wordmark SMANIT -->
  <text x="600" y="210" text-anchor="middle">
    <tspan class="logo-text-light">SMA</tspan>
    <tspan class="logo-n-light">N</tspan>
    <tspan class="logo-text-light">IT</tspan>
  </text>

  <!-- Underline under N -->
  <rect x="566" y="230" width="68" height="4" rx="2" fill="#d97706"/>

  <!-- Sub-label smanit.com -->
  <text x="600" y="280" text-anchor="middle" class="sub-text-light">SMANIT.COM</text>
</svg>
