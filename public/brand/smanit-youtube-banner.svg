<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1152" fill="none">
  <defs>
    <!-- Deep Cosmic Space Gradient -->
    <linearGradient id="ytBg" x1="0" y1="0" x2="2048" y2="1152">
      <stop offset="0%" stop-color="#020408"/>
      <stop offset="30%" stop-color="#060914"/>
      <stop offset="70%" stop-color="#090d1c"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <!-- Center Galactic Glow -->
    <radialGradient id="centerNebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="35%" stop-color="#2563eb" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#4f46e5" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Star Glow -->
    <linearGradient id="starGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="neonBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@900&amp;display=swap');
    .yt-title {
      font-family: 'Syne', 'Outfit', -apple-system, sans-serif;
      font-weight: 900;
      fill: #ffffff;
      font-size: 130px;
      letter-spacing: 0.18em;
    }
    .yt-sub {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      fill: #94a3b8;
      font-size: 18px;
      letter-spacing: 0.45em;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="2048" height="1152" fill="url(#ytBg)"/>
  <circle cx="1024" cy="576" r="800" fill="url(#centerNebula)"/>

  <!-- Subtle Constellation Stars & Neural Mesh Lines across the entire banner -->
  <g opacity="0.45">
    <line x1="240" y1="350" x2="480" y2="520" stroke="rgba(56,189,248,0.25)" stroke-width="1.2"/>
    <line x1="480" y1="520" x2="720" y2="420" stroke="rgba(56,189,248,0.25)" stroke-width="1.2"/>
    <line x1="1320" y1="500" x2="1560" y2="380" stroke="rgba(56,189,248,0.25)" stroke-width="1.2"/>
    <line x1="1560" y1="380" x2="1820" y2="580" stroke="rgba(56,189,248,0.25)" stroke-width="1.2"/>
    <line x1="480" y1="520" x2="380" y2="780" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>
    <line x1="1560" y1="380" x2="1680" y2="720" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>

    <!-- Stars -->
    <circle cx="240" cy="350" r="3" fill="#38bdf8"/>
    <circle cx="480" cy="520" r="4" fill="#ffffff"/>
    <circle cx="720" cy="420" r="3" fill="#38bdf8"/>
    <circle cx="1320" cy="500" r="3" fill="#38bdf8"/>
    <circle cx="1560" cy="380" r="4" fill="#ffffff"/>
    <circle cx="1820" cy="580" r="3" fill="#38bdf8"/>
    <circle cx="380" cy="780" r="2.5" fill="#bae6fd"/>
    <circle cx="1680" cy="720" r="2.5" fill="#bae6fd"/>
    
    <!-- Background field stars -->
    <circle cx="150" cy="180" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="890" cy="220" r="2" fill="#38bdf8" opacity="0.6"/>
    <circle cx="1200" cy="240" r="1.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="1900" cy="200" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="300" cy="950" r="2" fill="#38bdf8" opacity="0.7"/>
    <circle cx="1050" cy="980" r="1.5" fill="#ffffff" opacity="0.5"/>
    <circle cx="1750" cy="920" r="2" fill="#38bdf8" opacity="0.7"/>
  </g>

  <!-- SAFE ZONE (Center 1546x423 where mobile & desktop see everything) -->
  <!-- SMANIT Main Title -->
  <text x="1024" y="595" text-anchor="middle" class="yt-title">SMANIT</text>

  <!-- 4-Point Celestial Star atop 'I' -->
  <g transform="translate(1198, 488)" filter="url(#neonBlur)">
    <path d="M 0 -22 L 5 -5 L 22 0 L 5 5 L 0 22 L -5 5 L -22 0 L -5 -5 Z" fill="url(#starGlow)"/>
    <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
  </g>

  <!-- Sub-label smanit.com -->
  <text x="1024" y="660" text-anchor="middle" class="yt-sub">SMANIT.COM</text>
</svg>
