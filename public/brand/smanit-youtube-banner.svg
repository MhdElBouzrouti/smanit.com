<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1152" fill="none">
  <defs>
    <linearGradient id="ytBg" x1="0" y1="0" x2="2048" y2="1152">
      <stop offset="0%" stop-color="#030407"/>
      <stop offset="40%" stop-color="#070911"/>
      <stop offset="70%" stop-color="#0a0c16"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#b45309" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@900&amp;display=swap');
    .yt-title {
      font-family: 'Syne', 'Outfit', -apple-system, sans-serif;
      font-weight: 900;
      fill: #ffffff;
      font-size: 130px;
      letter-spacing: 0.18em;
    }
    .yt-n {
      font-family: 'Syne', 'Outfit', -apple-system, sans-serif;
      font-weight: 900;
      fill: #f59e0b;
      font-size: 130px;
    }
    .yt-sub {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      fill: #94a3b8;
      font-size: 16px;
      letter-spacing: 0.45em;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="2048" height="1152" fill="url(#ytBg)"/>
  <circle cx="1024" cy="576" r="750" fill="url(#centerAura)"/>

  <!-- Decision path & workflow structure -->
  <g opacity="0.35">
    <line x1="200" y1="576" x2="680" y2="576" stroke="rgba(255,255,255,0.1)" stroke-dasharray="6 8" stroke-width="1.5"/>
    <line x1="1368" y1="576" x2="1848" y2="576" stroke="rgba(255,255,255,0.1)" stroke-dasharray="6 8" stroke-width="1.5"/>
    
    <circle cx="440" cy="576" r="5" fill="#f59e0b"/>
    <circle cx="1608" cy="576" r="5" fill="#f59e0b"/>
  </g>

  <!-- SAFE ZONE (Center 1546x423 where mobile & desktop see everything) -->
  <!-- SMANIT Main Title with N in Amber -->
  <text x="1024" y="585" text-anchor="middle">
    <tspan class="yt-title">SMA</tspan>
    <tspan class="yt-n">N</tspan>
    <tspan class="yt-title">IT</tspan>
  </text>

  <!-- Human anchor baseline underline -->
  <rect x="996" y="605" width="56" height="4" rx="2" fill="#f59e0b"/>

  <!-- Sub-label smanit.com -->
  <text x="1024" y="660" text-anchor="middle" class="yt-sub">SMANIT.COM</text>
</svg>
