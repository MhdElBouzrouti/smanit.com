<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#06070a"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(245,158,11,0.25)" stroke-width="1.5"/>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@900&amp;display=swap');
    .fav-text {
      font-family: 'Syne', -apple-system, sans-serif;
      font-weight: 900;
      fill: #ffffff;
      font-size: 32px;
    }
    .fav-human {
      font-family: 'Syne', -apple-system, sans-serif;
      font-weight: 900;
      fill: #f59e0b;
      font-size: 32px;
    }
  </style>

  <!-- S / N / T structure: The N is the warm human anchor -->
  <text x="18" y="43" text-anchor="middle" class="fav-text">S</text>
  <text x="32" y="43" text-anchor="middle" class="fav-human">N</text>
  <text x="46" y="43" text-anchor="middle" class="fav-text">T</text>

  <!-- Human checkpoint dot -->
  <circle cx="32" cy="50" r="2" fill="#f59e0b"/>
</svg>
